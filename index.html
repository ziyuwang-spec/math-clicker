<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Empire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(circle at top, #493468, #181321 55%, #0d0b12);
    }

    .game {
      width: min(1150px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 390px;
      gap: 20px;
    }

    .panel {
      background: rgba(35, 27, 53, 0.96);
      border: 1px solid #67527f;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 16px 40px #0008;
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      color: #facc15;
      font-size: clamp(2.3rem, 6vw, 4rem);
      text-shadow: 3px 3px #725000;
    }

    h2 {
      margin-top: 0;
      color: #facc15;
    }

    .stats {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .stat {
      min-width: 125px;
      padding: 12px;
      text-align: center;
      border: 1px solid #ffffff18;
      border-radius: 12px;
      background: #ffffff0b;
    }

    .stat-label {
      display: block;
      color: #c9bfdc;
      font-size: 0.72rem;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      margin-top: 5px;
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .math-button {
      display: block;
      width: min(290px, 70vw);
      aspect-ratio: 1;
      margin: auto;
      border: 8px solid #bd8618;
      border-radius: 50%;
      color: #3a2700;
      background: radial-gradient(circle at 35% 25%, #fff4a3, #facc15 45%, #b77908);
      box-shadow: inset 0 -18px 20px #744b0038, 0 18px 25px #0008;
      font-size: 6rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .math-button:hover {
      filter: brightness(1.08);
    }

    .math-button:active {
      transform: scale(0.94);
    }

    .name-area,
    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .name-area {
      margin-top: 25px;
    }

    input {
      width: 230px;
      padding: 11px;
      border: 1px solid #ffffff33;
      border-radius: 9px;
      color: white;
      background: #ffffff0d;
      font-size: 1rem;
    }

    input::placeholder {
      color: #c9bfdc;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .green {
      color: #102417;
      background: #35d17c;
    }

    .purple {
      color: white;
      background: #8b5cf6;
    }

    .red {
      color: white;
      background: #ef6675;
    }

    .button-row {
      margin-top: 12px;
    }

    .status {
      margin-top: 14px;
      color: #c9bfdc;
      font-size: 0.8rem;
      text-align: center;
    }

    .log {
      min-height: 90px;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 18px;
      padding: 10px;
      border-radius: 10px;
      color: #c9bfdc;
      background: #100d17aa;
      font-size: 0.85rem;
    }

    .log div {
      padding: 5px 0;
      border-bottom: 1px solid #ffffff12;
    }

    .building {
      display: grid;
      grid-template-columns: 45px 1fr auto;
      gap: 9px;
      align-items: center;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ffffff14;
      border-radius: 11px;
      background: #ffffff0b;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border-radius: 10px;
      background: #8b5cf622;
      font-size: 1.6rem;
    }

    .building-name {
      font-weight: bold;
    }

    .building-info {
      margin-top: 4px;
      color: #c9bfdc;
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .buy {
      min-width: 78px;
      color: #102417;
      background: #35d17c;
    }

    .buy small {
      display: block;
      margin-top: 3px;
    }

    .leaderboard {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .leaderboard li {
      display: grid;
      grid-template-columns: 35px 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 7px;
      padding: 9px;
      border-radius: 9px;
      background: #ffffff0a;
    }

    .rank {
      color: #facc15;
      font-weight: bold;
    }

    .leader-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leader-score {
      color: #35d17c;
      font-weight: bold;
    }

    .floating {
      position: fixed;
      z-index: 5;
      pointer-events: none;
      color: #facc15;
      font-size: 1.3rem;
      font-weight: bold;
      animation: floatUp 0.8s ease-out forwards;
    }

    @keyframes floatUp {
      from {
        opacity: 1;
        transform: translateY(0);
      }

      to {
        opacity: 0;
        transform: translateY(-70px);
      }
    }

    @media (max-width: 850px) {
      .game {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="game">
    <main class="panel">
      <h1>Math Empire</h1>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Math Points</span>
          <span class="stat-value" id="points">0</span>
        </div>

        <div class="stat">
          <span class="stat-label">Per Click</span>
          <span class="stat-value" id="perClick">1</span>
        </div>

        <div class="stat">
          <span class="stat-label">Per Second</span>
          <span class="stat-value" id="perSecond">0</span>
        </div>
      </div>

      <button class="math-button" id="clickButton">+</button>

      <div class="name-area">
        <input id="nameInput" maxlength="18" placeholder="Enter your name">
        <button class="purple" id="nameButton">Change Name</button>
      </div>

      <div class="button-row">
        <button class="green" id="saveButton">Save Score Online</button>
        <button class="red" id="resetButton">Reset Game</button>
      </div>

      <div class="status" id="status">Connecting...</div>
      <div class="log" id="log"></div>
    </main>

    <aside class="panel">
      <h2>Math Buildings</h2>
      <div id="buildings"></div>

      <h2>Global Ranking</h2>
      <ol class="leaderboard" id="leaderboard">
        <li>Loading scores...</li>
      </ol>
    </aside>
  </div>

  <script type="module">
    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    /*
      REPLACE THESE TWO VALUES.
    */

    const SUPABASE_URL = "https://nyweluapgfpgxlnrjhtu.supabase.co";

    const SUPABASE_ANON_KEY = "sb_publishable_3BABa8N5QCbv-INmQE8_-g_RxayMoQC";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const SAVE_KEY = "math-empire-local-save";
    const PLAYER_ID_KEY = "math-empire-player-id";

    const buildingTypes = {
      abacus: {
        name: "Abacus",
        icon: "🧮",
        description: "Counts numbers automatically.",
        baseCost: 15,
        income: 0.1,
        clickBonus: 1
      },

      addition: {
        name: "Addition Academy",
        icon: "➕",
        description: "Students solve addition problems.",
        baseCost: 100,
        income: 1,
        clickBonus: 4
      },

      multiplication: {
        name: "Multiplication Mill",
        icon: "✖️",
        description: "Produces multiplication points.",
        baseCost: 500,
        income: 8,
        clickBonus: 12
      },

      geometry: {
        name: "Geometry Lab",
        icon: "📐",
        description: "Studies shapes and angles.",
        baseCost: 2500,
        income: 47,
        clickBonus: 35
      },

      calculus: {
        name: "Calculus Core",
        icon: "∫",
        description: "Calculates infinite change.",
        baseCost: 12000,
        income: 260,
        clickBonus: 120
      },

      probability: {
        name: "Probability Engine",
        icon: "🎲",
        description: "Predicts possible outcomes.",
        baseCost: 60000,
        income: 1400,
        clickBonus: 420
      },

      supercomputer: {
        name: "Math Supercomputer",
        icon: "💻",
        description: "Solves impossible equations.",
        baseCost: 300000,
        income: 8000,
        clickBonus: 1700
      }
    };

    function newGame() {
      return {
        points: 0,
        perClick: 1,
        clicks: 0,
        name: "",
        owned: {
          abacus: 0,
          addition: 0,
          multiplication: 0,
          geometry: 0,
          calculus: 0,
          probability: 0,
          supercomputer: 0
        }
      };
    }

    function loadGame() {
      const saved = localStorage.getItem(SAVE_KEY);

      if (!saved) {
        return newGame();
      }

      try {
        const parsed = JSON.parse(saved);
        const fresh = newGame();

        return {
          ...fresh,
          ...parsed,
          owned: {
            ...fresh.owned,
            ...(parsed.owned || {})
          }
        };
      } catch {
        return newGame();
      }
    }

    let game = loadGame();

    const pointsElement = document.getElementById("points");
    const perClickElement = document.getElementById("perClick");
    const perSecondElement = document.getElementById("perSecond");
    const buildingsElement = document.getElementById("buildings");
    const leaderboardElement = document.getElementById("leaderboard");
    const nameInput = document.getElementById("nameInput");
    const logElement = document.getElementById("log");
    const statusElement = document.getElementById("status");
    const clickButton = document.getElementById("clickButton");

    nameInput.value = game.name;

    function getPlayerId() {
      let id = localStorage.getItem(PLAYER_ID_KEY);

      if (!id) {
        id =
          "player-" +
          Date.now() +
          "-" +
          Math.random().toString(36).slice(2);

        localStorage.setItem(PLAYER_ID_KEY, id);
      }

      return id;
    }

    const playerId = getPlayerId();

    function formatNumber(value) {
      if (!Number.isFinite(value)) return "0";
      if (value >= 1000000000) return (value / 1000000000).toFixed(2) + "B";
      if (value >= 1000000) return (value / 1000000).toFixed(2) + "M";
      if (value >= 1000) return (value / 1000).toFixed(2) + "K";
      if (Number.isInteger(value)) return String(value);
      return value.toFixed(1);
    }

    function saveLocal() {
      game.name = nameInput.value.trim().slice(0, 18);
      localStorage.setItem(SAVE_KEY, JSON.stringify(game));
    }

    function getBuildingCost(type) {
      const building = buildingTypes[type];
      return Math.floor(
        building.baseCost * Math.pow(1.15, game.owned[type])
      );
    }

    function getPointsPerSecond() {
      let total = 0;

      for (const type in buildingTypes) {
        total += game.owned[type] * buildingTypes[type].income;
      }

      return total;
    }

    function addLog(message) {
      const line = document.createElement("div");
      line.textContent = message;
      logElement.prepend(line);

      while (logElement.children.length > 8) {
        logElement.lastElementChild.remove();
      }
    }

    function updateScreen() {
      pointsElement.textContent = formatNumber(game.points);
      perClickElement.textContent = formatNumber(game.perClick);
      perSecondElement.textContent =
        formatNumber(getPointsPerSecond());

      buildingsElement.innerHTML = "";

      for (const type in buildingTypes) {
        const building = buildingTypes[type];
        const cost = getBuildingCost(type);
        const owned = game.owned[type];

        const row = document.createElement("div");
        row.className = "building";

        row.innerHTML = `
          <div class="icon">${building.icon}</div>

          <div>
            <div class="building-name">
              ${building.name} (${owned})
            </div>

            <div class="building-info">
              ${building.description}<br>
              +${formatNumber(building.income)} points per second
            </div>
          </div>

          <button
            class="buy"
            data-type="${type}"
            ${game.points < cost ? "disabled" : ""}
          >
            Buy
            <small>${formatNumber(cost)}</small>
          </button>
        `;

        buildingsElement.appendChild(row);
      }

      document.querySelectorAll(".buy").forEach(button => {
        button.addEventListener("click", () => {
          buyBuilding(button.dataset.type);
        });
      });
    }

    function showFloatingNumber(value) {
      const floating = document.createElement("div");
      const rectangle = clickButton.getBoundingClientRect();

      floating.className = "floating";
      floating.textContent = "+" + formatNumber(value);
      floating.style.left =
        rectangle.left + rectangle.width / 2 + "px";
      floating.style.top =
        rectangle.top + rectangle.height / 2 + "px";

      document.body.appendChild(floating);

      setTimeout(() => floating.remove(), 800);
    }

    function clickMath() {
      game.points += game.perClick;
      game.clicks++;

      showFloatingNumber(game.perClick);
      updateScreen();
      saveLocal();
    }

    function buyBuilding(type) {
      const building = buildingTypes[type];
      const cost = getBuildingCost(type);

      if (game.points < cost) return;

      game.points -= cost;
      game.owned[type]++;
      game.perClick += building.clickBonus;

      addLog("Bought " + building.name + "!");
      updateScreen();
      saveLocal();
    }

    function checkNameCheat() {
      const name = nameInput.value.trim().toLowerCase();

      if (name === "math wizard") {
        game.perClick = 100;
        addLog("Math Wizard cheat activated!");
      }

      if (name === "einstein") {
        game.perClick = 1000;
        addLog("Einstein cheat activated!");
      }

      if (name === "calculator") {
        game.points += 10000;
        addLog("+10,000 Math Points!");
      }

      if (name === "infinity") {
        game.points += 1000000;
        addLog("+1,000,000 Math Points!");
      }

      if (name === "resetcheat") {
        game.perClick = 1;
        addLog("Cheats removed.");
      }
    }

    async function saveScoreOnline() {
      const name = nameInput.value.trim() || "Player";

      game.name = name.slice(0, 18);
      saveLocal();

      statusElement.textContent = "Saving online...";

      const { error } = await supabase
        .from("leaderboard")
        .upsert({
          player_id: playerId,
          player_name: game.name,
          score: Math.floor(game.points),
          clicks: game.clicks,
          updated_at: new Date().toISOString()
        }, {
          onConflict: "player_id"
        });

      if (error) {
        console.error(error);
        statusElement.textContent = "Online save failed";
        addLog("Could not save online.");
        return;
      }

      statusElement.textContent = "Score saved online";
      addLog("Your score was saved online.");
      await loadLeaderboard();
    }

    async function loadLeaderboard() {
      const { data, error } = await supabase
        .from("leaderboard")
        .select("player_id, player_name, score, clicks")
        .order("score", { ascending: false })
        .limit(20);

      if (error) {
        console.error(error);
        statusElement.textContent = "Leaderboard connection failed";
        leaderboardElement.innerHTML =
          "<li>Could not load leaderboard.</li>";
        return;
      }

      statusElement.textContent = "Leaderboard connected";
      leaderboardElement.innerHTML = "";

      if (!data || data.length === 0) {
        leaderboardElement.innerHTML = "<li>No scores yet.</li>";
        return;
      }

      data.forEach((player, index) => {
        const row = document.createElement("li");

        const rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = "#" + (index + 1);

        const name = document.createElement("span");
        name.className = "leader-name";
        name.textContent = player.player_name || "Player";

        const score = document.createElement("span");
        score.className = "leader-score";
        score.textContent = formatNumber(player.score);

        row.append(rank, name, score);
        leaderboardElement.appendChild(row);
      });
    }

    function subscribeToLeaderboard() {
      supabase
        .channel("leaderboard-changes")
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "leaderboard"
          },
          () => {
            loadLeaderboard();
          }
        )
        .subscribe();
    }

    clickButton.addEventListener("click", clickMath);

    document
      .getElementById("nameButton")
      .addEventListener("click", async () => {
        const name = nameInput.value.trim();

        if (name.length < 2) {
          addLog("Your name needs at least 2 characters.");
          return;
        }

        game.name = name.slice(0, 18);
        nameInput.value = game.name;

        checkNameCheat();
        saveLocal();
        updateScreen();

        addLog("Your name is now " + game.name + ".");
        await saveScoreOnline();
      });

    document
      .getElementById("saveButton")
      .addEventListener("click", saveScoreOnline);

    document
      .getElementById("resetButton")
      .addEventListener("click", () => {
        if (!confirm("Reset your entire game?")) return;

        game = newGame();
        nameInput.value = "";
        saveLocal();
        updateScreen();
        addLog("Game reset.");
      });

    setInterval(() => {
      const income = getPointsPerSecond();

      if (income > 0) {
        game.points += income / 10;
        updateScreen();
      }

      saveLocal();
    }, 100);

    addLog("Welcome to Math Empire!");
    addLog("Click the plus button to earn points.");
    addLog("Buy buildings to earn points automatically.");

    updateScreen();
    loadLeaderboard();
    subscribeToLeaderboard();
  </script>
</body>
</html>
